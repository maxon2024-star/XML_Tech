<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Web App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .product-card {
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }
        .product-card img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            margin-right: 10px;
        }
        .product-form {
            margin-bottom: 20px;
        }
        .product-form input, .product-form textarea, .product-form button {
            display: block;
            margin-bottom: 10px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="app" class="container"></div>
    <script type="module" src="./main.js"></script>
</body>
</html>
