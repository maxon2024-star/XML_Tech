<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование продукта</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Редактирование продукта</h1>
        <div class="edit-card">
            <form id="editForm">
                <input type="hidden" id="productId">
                <label>Изображение: <input type="text" id="src" required></label>
                <label>Название: <input type="text" id="title" required></label>
                <label>Описание: <textarea id="description" required></textarea></label>
                <label>Цена: <input type="number" id="price" required></label>
                <button type="submit">Сохранить</button>
                <button type="button" id="deleteBtn">Удалить</button>
                <button type="b" id="backBtn">Назад</button>
            </form>
        </div>
    </div>

    <script src="scripts/api.js"></script>
    <script src="scripts/edit.js"></script>
</body>
</html>
